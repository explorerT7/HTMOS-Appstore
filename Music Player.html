<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #181818; color: #ffffff; height: 100vh; display: flex; flex-direction: column; padding: 20px; overflow: hidden; }
        
        .player-container { display: flex; flex-direction: column; gap: 16px; height: 100%; max-width: 600px; margin: 0 auto; width: 100%; justify-content: space-between; }
        
        .album-art { width: 100%; height: 180px; background: #282828; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 54px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        
        .track-info { text-align: center; }
        .track-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 12px; color: #b3b3b3; }

        .progress-container { display: flex; flex-direction: column; gap: 6px; }
        .progress-bar { width: 100%; height: 6px; background: #404040; border-radius: 3px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; background: #1db954; border-radius: 3px; width: 0%; transition: width 0.1s linear; }
        .time-labels { display: flex; justify-content: space-between; font-size: 11px; color: #b3b3b3; }

        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
        .ctrl-btn { background: transparent; border: none; color: #ffffff; font-size: 18px; cursor: pointer; transition: transform 0.1s, color 0.1s; }
        .ctrl-btn:hover { color: #1db954; transform: scale(1.1); }
        .play-pause-btn { width: 44px; height: 44px; background: #1db954; color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; border: none; transition: transform 0.1s, background 0.1s; }
        .play-pause-btn:hover { background: #1ed760; transform: scale(1.05); }

        .playlist-box { flex: 1; background: #242424; border-radius: 8px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .playlist-item { padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; transition: background 0.15s; }
        .playlist-item:hover { background: #333333; }
        .playlist-item.active { background: #1db954; color: #fff; font-weight: 600; }

        .action-row { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 10px; background: #282828; border: 1px solid #444; border-radius: 6px; text-align: center; font-size: 13px; cursor: pointer; color: #ffffff; font-weight: 600; transition: background 0.2s, border-color 0.2s; }
        .action-btn:hover { background: #333; border-color: #1db954; }
    </style>
</head>
<body>

    <audio id="audio-element" preload="auto"></audio>

    <div class="player-container">
        <div class="album-art" id="album-art-container">🎵</div>

        <div class="track-info">
            <div class="track-title" id="track-title">No track selected</div>
            <div class="track-artist" id="track-artist">HTMOS Local Storage</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar" onclick="seekTrack(event)">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="time-labels">
                <span id="current-time">0:00</span>
                <span id="total-duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
            <button class="play-pause-btn" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
        </div>

        <div class="playlist-box" id="playlist-box">
            <div style="text-align: center; color: #777; font-size: 12px; padding: 20px;">Scanning HTMOS storage for audio files...</div>
        </div>

        <div class="action-row">
            <button class="action-btn" onclick="loadStorageTracks()">🔄 Refresh Storage Files</button>
        </div>
    </div>

    <script>
        let playlist = [];
        let currentIndex = 0;
        const audioElement = document.getElementById('audio-element');

        audioElement.addEventListener('timeupdate', updateProgress);
        audioElement.addEventListener('ended', nextTrack);
        audioElement.addEventListener('error', (e) => {
            console.error("Audio element error detected:", audioElement.error);
            document.getElementById('track-title').innerText = "Playback Error (Invalid Format)";
        });

        function getHtmosFiles() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("HTMOS_DB", 1);
                request.onerror = () => reject("Failed to connect to HTMOS storage.");
                request.onsuccess = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains("filesystem")) {
                        resolve({});
                        return;
                    }
                    const transaction = db.transaction(["filesystem"], "readonly");
                    const store = transaction.objectStore("filesystem");
                    const getReq = store.get("htmos_filesystem");
                    getReq.onsuccess = () => resolve(getReq.result || {});
                    getReq.onerror = () => reject("Could not read HTMOS filesystem.");
                };
            });
        }

        async function loadStorageTracks() {
            const box = document.getElementById('playlist-box');
            box.innerHTML = `<div style="text-align: center; color: #777; font-size: 12px; padding: 20px;">Loading tracks from storage...</div>`;

            try {
                const fs = await getHtmosFiles();
                playlist = [];

                for (const [filename, content] of Object.entries(fs)) {
                    if (filename.match(/\.(mp3|wav|ogg|m4a)$/i)) {
                        let audioSrc = "";
                        
                        if (content instanceof Blob || content instanceof File) {
                            audioSrc = URL.createObjectURL(content);
                        } else if (typeof content === 'string') {
                            if (content.startsWith('data:audio/')) {
                                audioSrc = content;
                            } else {
                                // Create a clean typed blob out of the string data to bypass raw string re-encoding blocks
                                const blob = new Blob([content], { type: filename.endsWith('.wav') ? 'audio/wav' : 'audio/mpeg' });
                                audioSrc = URL.createObjectURL(blob);
                            }
                        } else if (content instanceof ArrayBuffer || ArrayBuffer.isView(content)) {
                            const blob = new Blob([content], { type: filename.endsWith('.wav') ? 'audio/wav' : 'audio/mpeg' });
                            audioSrc = URL.createObjectURL(blob);
                        }

                        if (audioSrc) {
                            playlist.push({
                                name: filename.replace(/\.[^/.]+$/, ""),
                                filename: filename,
                                url: audioSrc
                            });
                        }
                    }
                }

                renderPlaylist();
                if (playlist.length > 0 && !audioElement.src) {
                    loadTrack(0);
                }
            } catch (err) {
                console.error("Storage loading error:", err);
                box.innerHTML = `<div style="text-align: center; color: #e81123; font-size: 12px; padding: 20px;">Error reading local storage.</div>`;
            }
        }

        function renderPlaylist() {
            const box = document.getElementById('playlist-box');
            box.innerHTML = "";

            if (playlist.length === 0) {
                box.innerHTML = `<div style="text-align: center; color: #777; font-size: 12px; padding: 20px;">No music files found in HTMOS storage.<br><br>Tip: Save or upload your audio files properly in HTMOS!</div>`;
                return;
            }

            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
                item.innerHTML = `<span>🎵 ${track.filename}</span>`;
                item.onclick = () => loadAndPlay(index);
                box.appendChild(item);
            });
        }

        function loadTrack(index) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            const track = playlist[currentIndex];

            audioElement.src = track.url;
            audioElement.load();
            document.getElementById('track-title').innerText = track.name;
            document.getElementById('track-artist').innerText = "HTMOS Local Storage";
            renderPlaylist();
        }

        function loadAndPlay(index) {
            loadTrack(index);
            playTrack();
        }

        function togglePlay() {
            if (playlist.length === 0) return;
            if (audioElement.paused) {
                playTrack();
            } else {
                pauseTrack();
            }
        }

        function playTrack() {
            if (playlist.length === 0) return;
            const playPromise = audioElement.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    document.getElementById('play-btn').innerText = "⏸";
                }).catch(error => {
                    console.error("Playback rejected:", error);
                });
            }
        }

        function pauseTrack() {
            audioElement.pause();
            document.getElementById('play-btn').innerText = "▶";
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex + 1) % playlist.length;
            loadAndPlay(currentIndex);
        }

        function prevTrack() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadAndPlay(currentIndex);
        }

        function updateProgress() {
            if (isNaN(audioElement.duration)) return;
            const current = audioElement.currentTime;
            const duration = audioElement.duration;

            const percentage = (current / duration) * 100;
            document.getElementById('progress-fill').style.width = `${percentage}%`;

            document.getElementById('current-time').innerText = formatTime(current);
            document.getElementById('total-duration').innerText = formatTime(duration);
        }

        function seekTrack(e) {
            if (isNaN(audioElement.duration)) return;
            const bar = document.getElementById('progress-bar');
            const rect = bar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = clickX / rect.width;

            audioElement.currentTime = percentage * audioElement.duration;
        }

        function formatTime(secs) {
            const mins = Math.floor(secs / 60);
            const remainingSecs = Math.floor(secs % 60);
            return `${mins}:${remainingSecs < 10 ? '0' : ''}${remainingSecs}`;
        }

        window.addEventListener('DOMContentLoaded', loadStorageTracks);
    </script>
</body>
</html>
